name: Deploy report to GitHub Pages

# Serves docs/ (the interactive CEO evaluation report) at
# https://<owner>.github.io/majak/. The report is a self-contained static HTML
# file, so this is a plain static-site deploy.
#
# NOTE: GitHub Pages is publicly accessible. The report embeds business data;
# this deployment is intentional and was explicitly requested.

on:
  push:
    branches: ["claude/new-session-w0amso", "main"]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages (enables Pages if not already on)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload docs/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
