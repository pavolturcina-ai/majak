[project]
name = "majak"
version = "0.1.0"
description = "MAJÁK — a personal CEO assistant that ingests daily inputs, resolves people, and produces a structured daily evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "GOSPACE LABS s.r.o." }]

dependencies = [
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    # DB
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "supabase>=2.5",
    # LLM
    "anthropic>=0.34",
    # Text extraction
    "beautifulsoup4>=4.12",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "mail-parser>=3.15",
    # Name matching
    "rapidfuzz>=3.9",
    # Misc
    "httpx>=0.27",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "black>=24.4",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
]
ocr = [
    "pytesseract>=0.3.10",
    "pillow>=10.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/majak"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.black]
line-length = 100
target-version = ["py312"]
