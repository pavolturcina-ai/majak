line-length = 100
target-version = "py312"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplify
]
ignore = [
    "E501", # line length handled by black
    "B008", # FastAPI Depends() in defaults is idiomatic
]

[lint.isort]
known-first-party = ["majak"]
