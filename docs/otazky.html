<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJÁK — Otázky</title>
<meta name="description" content="Otázky — kde sa MAJÁK pýta, keď si nie je istý (osoby, nízka istota). Odpovedz a systém sa učí.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="./auth.js"></script>
<style>
  :root{
    --paper:#f7f8f6;--card:#fff;--card-2:#fbfcfa;--ink:#151a1d;--ink-soft:#4a555b;--ink-faint:#8b969b;
    --line:#e5e8e4;--line-soft:#eef1ee;--signal:#0e6b7a;--signal-tint:#e6f1f2;--signal-deep:#0a4f5a;
    --win:#1f8a54;--warn:#b26a00;--threat:#c0392b;--radius:14px;
    --shadow:0 1px 2px rgba(20,26,29,.04),0 6px 22px rgba(20,26,29,.05);
    --sans:"Inter",system-ui,-apple-system,sans-serif;--disp:"Space Grotesk",var(--sans);
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#0f1413;--card:#161d1c;--card-2:#131a19;--ink:#e7ece9;--ink-soft:#9aa6a1;--ink-faint:#6c7a74;
    --line:#27302d;--line-soft:#1e2624;--signal:#3fa9bb;--signal-tint:#123030;--signal-deep:#5cc0d0;
    --win:#48b57a;--warn:#d29a3e;--threat:#e0685c;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.32);}}
  :root[data-theme="dark"]{--paper:#0f1413;--card:#161d1c;--card-2:#131a19;--ink:#e7ece9;--ink-soft:#9aa6a1;
    --ink-faint:#6c7a74;--line:#27302d;--line-soft:#1e2624;--signal:#3fa9bb;--signal-tint:#123030;--signal-deep:#5cc0d0;
    --win:#48b57a;--warn:#d29a3e;--threat:#e0685c;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.32);}
  :root[data-theme="light"]{--paper:#f7f8f6;--card:#fff;--card-2:#fbfcfa;--ink:#151a1d;--ink-soft:#4a555b;
    --ink-faint:#8b969b;--line:#e5e8e4;--line-soft:#eef1ee;--signal:#0e6b7a;--signal-tint:#e6f1f2;--signal-deep:#0a4f5a;
    --win:#1f8a54;--warn:#b26a00;--threat:#c0392b;--shadow:0 1px 2px rgba(20,26,29,.04),0 6px 22px rgba(20,26,29,.05);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;padding-bottom:60px}
  .top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top .in{max-width:820px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:14px}
  .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
  .beacon{width:26px;height:26px;border-radius:7px;flex:none;border:1px solid var(--line);
    background:radial-gradient(circle at 50% 32%,var(--signal) 0 26%,transparent 27%),var(--card)}
  .logo b{font-family:var(--disp);font-weight:700;letter-spacing:.16em;font-size:15px}
  .nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;align-items:center}
  .nav a{font-size:13px;color:var(--ink-soft);text-decoration:none;padding:6px 11px;border-radius:8px}
  .nav a:hover{background:var(--signal-tint);color:var(--signal-deep)}
  .nav a.active{background:var(--signal);color:#fff}
  .wrap{max-width:820px;margin:0 auto;padding:0 22px}
  header.hd{padding:36px 0 10px}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);font-weight:500;margin-bottom:10px}
  h1{font-family:var(--disp);font-weight:700;font-size:clamp(26px,4vw,32px);letter-spacing:-.02em;margin:0 0 8px}
  .lead{font-size:15.5px;color:var(--ink-soft);max-width:64ch;margin:0}
  .count{font-family:var(--mono);font-size:12.5px;color:var(--ink-faint);margin:18px 0 8px}
  .q{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
  .q.person{border-left-color:var(--signal)}
  .q .kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
  .q .qt{font-weight:600;font-size:16px;margin:6px 0 4px}
  .q .ctx{font-size:13.5px;color:var(--ink-soft);font-style:italic;border-left:2px solid var(--line);padding-left:10px;margin:8px 0}
  .cands{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .b{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--card-2);color:var(--ink);
    border-radius:8px;padding:7px 13px}
  .b:hover{border-color:var(--signal);color:var(--signal-deep)}
  .b.pri{background:var(--signal);color:#fff;border-color:var(--signal)}
  .b.pri:hover{background:var(--signal-deep)}
  .b.new{border-style:dashed}
  .b.dis:hover{border-color:var(--threat);color:var(--threat)}
  .b .sc{font-family:var(--mono);font-size:10.5px;opacity:.7;margin-left:5px}
  .empty{text-align:center;color:var(--ink-faint);padding:50px 0;font-size:15px}
  .empty .big{font-size:34px;margin-bottom:8px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);
    padding:10px 15px;border-radius:9px;font-size:13.5px;opacity:0;transition:.2s;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  :focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:5px}
</style>
</head>
<body>
<div class="top">
  <div class="in">
    <a class="logo" href="./index.html"><span class="beacon" aria-hidden="true"></span><b>MAJÁK</b></a>
    <nav class="nav">
      <a href="./index.html">Hub</a>
      <a href="./report.html">Report</a>
      <a href="./import.html">Import</a>
      <a href="./zoznam.html">Zoznam</a>
      <a href="./osoby.html">Osoby</a>
      <a href="./otazky.html" class="active" aria-current="page">Otázky</a>
      <a href="./behy.html">Behy</a>
    </nav>
  </div>
</div>
<div class="wrap">
  <header class="hd">
    <div class="eyebrow">Otázky · MAJÁK sa pýta</div>
    <h1>Na čo potrebujem tvoju odpoveď</h1>
    <p class="lead">Keď si systém nie je istý — nejednoznačná osoba alebo položka s nízkou istotou —
      spýta sa <b>teba</b> namiesto hádania. Tvoja odpoveď sa uloží a systém sa <b>učí</b>
      (napr. preklep sa zapamätá ako alias).</p>
  </header>
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var DEF="https://majak-api.onrender.com/api";
  function base(){return (localStorage.getItem("majak.apiBase")||DEF).replace(/\/$/,"");}
  function token(){return localStorage.getItem("majak.token")||"";}
  function H(json){var h={Authorization:"Bearer "+token()};if(json)h["Content-Type"]="application/json";return h;}
  var $=function(s){return document.querySelector(s)};
  var esc=function(s){return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};

  function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("show")},2400);}

  async function resolve(id,body){
    var r=await fetch(base()+"/review-queue/"+id+"/resolve",{method:"POST",headers:H(true),body:JSON.stringify(body)});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }

  function card(row){
    var p=row.payload||{};
    var d=document.createElement("div");
    var isPerson=row.kind==="person_ambiguous";
    d.className="q"+(isPerson?" person":"");
    var html='<div class="kind">'+esc(row.kind)+'</div>';
    if(isPerson){
      html+='<div class="qt">Kto je „'+esc(p.raw_name||"?")+'"?</div>';
      if(p.context) html+='<div class="ctx">'+esc(p.context)+'</div>';
    } else if(row.kind==="low_confidence_extract"){
      html+='<div class="qt">Ponechať položku „'+esc(p.title||"?")+'"?</div>';
      html+='<div class="ctx">sekcia '+esc(p.section||"?")+' · istota '+esc(p.confidence)+'</div>';
    } else {
      html+='<div class="qt">'+esc(p.note||"Vyžaduje kontrolu")+'</div>';
    }
    html+='<div class="cands"></div>';
    d.innerHTML=html;
    var cands=d.querySelector(".cands");

    function actBtn(label, cls, body){
      var b=document.createElement("button");b.className="b "+(cls||"");b.innerHTML=label;
      b.onclick=async function(){
        b.disabled=true;
        try{ await resolve(row.id, body); d.remove(); toast("Uložené — systém sa naučil."); load(); }
        catch(e){ b.disabled=false; toast("Chyba: "+e.message); }
      };
      cands.appendChild(b);
    }

    if(isPerson){
      (p.candidates||[]).forEach(function(c){
        if(!c.person_id) return;
        actBtn('Priradiť: '+esc(c.name)+'<span class="sc">'+(c.score!=null?Math.round(c.score*100)+"%":"")+'</span>',"pri",{person_id:c.person_id});
      });
      actBtn("➕ Nová osoba","new",{create_new:true});
      actBtn("Zamietnuť","dis",{dismiss:true});
    } else if(row.kind==="low_confidence_extract"){
      actBtn("✓ Ponechať","pri",{});
      actBtn("Zamietnuť","dis",{dismiss:true});
    } else {
      actBtn("✓ Vyriešené","pri",{});
      actBtn("Zamietnuť","dis",{dismiss:true});
    }
    return d;
  }

  async function load(){
    var list=$("#list"), cnt=$("#count");
    try{
      var r=await fetch(base()+"/review-queue",{headers:H(false)});
      if(!r.ok) throw new Error("HTTP "+r.status);
      var rows=await r.json();
      cnt.textContent=rows.length+" otázok na zodpovedanie";
      list.innerHTML="";
      if(!rows.length){ list.innerHTML='<div class="empty"><div class="big">✓</div>Žiadne otvorené otázky. Všetko jasné.</div>'; return; }
      rows.forEach(function(row){ list.appendChild(card(row)); });
    }catch(e){
      cnt.textContent="";
      list.innerHTML='<div class="empty">Nepodarilo sa načítať otázky: '+esc(e.message)+'</div>';
    }
  }
  if(token()) load();
})();
</script>
</body>
</html>
