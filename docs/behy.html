<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJÁK — Behy</title>
<meta name="description" content="Behy — kontrola každého plánovaného behu: čo zbehlo, čo nie, koľko sa stiahlo a spracovalo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="./auth.js"></script>
<style>
  :root{
    --paper:#f7f8f6;--card:#fff;--card-2:#fbfcfa;--ink:#151a1d;--ink-soft:#4a555b;--ink-faint:#8b969b;
    --line:#e5e8e4;--line-soft:#eef1ee;--signal:#0e6b7a;--signal-tint:#e6f1f2;--signal-deep:#0a4f5a;
    --win:#1f8a54;--win-tint:#e7f3ec;--warn:#b26a00;--threat:#c0392b;--threat-tint:#fbe9e6;--radius:14px;
    --shadow:0 1px 2px rgba(20,26,29,.04),0 6px 22px rgba(20,26,29,.05);
    --sans:"Inter",system-ui,-apple-system,sans-serif;--disp:"Space Grotesk",var(--sans);
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#0f1413;--card:#161d1c;--card-2:#131a19;--ink:#e7ece9;--ink-soft:#9aa6a1;--ink-faint:#6c7a74;
    --line:#27302d;--line-soft:#1e2624;--signal:#3fa9bb;--signal-tint:#123030;--signal-deep:#5cc0d0;
    --win:#48b57a;--win-tint:#14281d;--warn:#d29a3e;--threat:#e0685c;--threat-tint:#2a1614;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.32);}}
  :root[data-theme="dark"]{--paper:#0f1413;--card:#161d1c;--card-2:#131a19;--ink:#e7ece9;--ink-soft:#9aa6a1;
    --ink-faint:#6c7a74;--line:#27302d;--line-soft:#1e2624;--signal:#3fa9bb;--signal-tint:#123030;--signal-deep:#5cc0d0;
    --win:#48b57a;--win-tint:#14281d;--warn:#d29a3e;--threat:#e0685c;--threat-tint:#2a1614;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.32);}
  :root[data-theme="light"]{--paper:#f7f8f6;--card:#fff;--card-2:#fbfcfa;--ink:#151a1d;--ink-soft:#4a555b;
    --ink-faint:#8b969b;--line:#e5e8e4;--line-soft:#eef1ee;--signal:#0e6b7a;--signal-tint:#e6f1f2;--signal-deep:#0a4f5a;
    --win:#1f8a54;--win-tint:#e7f3ec;--warn:#b26a00;--threat:#c0392b;--threat-tint:#fbe9e6;--shadow:0 1px 2px rgba(20,26,29,.04),0 6px 22px rgba(20,26,29,.05);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding-bottom:60px}
  .top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top .in{max-width:860px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:14px}
  .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
  .beacon{width:26px;height:26px;border-radius:7px;flex:none;border:1px solid var(--line);
    background:radial-gradient(circle at 50% 32%,var(--signal) 0 26%,transparent 27%),var(--card)}
  .logo b{font-family:var(--disp);font-weight:700;letter-spacing:.16em;font-size:15px}
  .nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;align-items:center}
  .nav a{font-size:13px;color:var(--ink-soft);text-decoration:none;padding:6px 11px;border-radius:8px}
  .nav a:hover{background:var(--signal-tint);color:var(--signal-deep)}
  .nav a.active{background:var(--signal);color:#fff}
  .wrap{max-width:860px;margin:0 auto;padding:0 22px}
  header.hd{padding:36px 0 10px}
  .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);font-weight:500;margin-bottom:10px}
  h1{font-family:var(--disp);font-weight:700;font-size:clamp(26px,4vw,32px);letter-spacing:-.02em;margin:0 0 8px}
  .lead{font-size:15.5px;color:var(--ink-soft);max-width:64ch;margin:0}
  .refresh{margin:16px 0 6px;display:flex;gap:10px;align-items:center}
  .b{font:inherit;font-size:12.5px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);border-radius:8px;padding:6px 12px}
  .b:hover{border-color:var(--signal);color:var(--signal-deep)}
  .count{font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
  .run{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;border-left:3px solid var(--ink-faint)}
  .run.ok{border-left-color:var(--win)} .run.failed{border-left-color:var(--threat)}
  .run.running{border-left-color:var(--warn)} .run.skipped{border-left-color:var(--ink-faint)}
  .rh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .job{font-family:var(--disp);font-weight:600;font-size:15px}
  .st{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid var(--line)}
  .st.ok{color:var(--win);background:var(--win-tint);border-color:color-mix(in srgb,var(--win) 35%,var(--line))}
  .st.failed{color:var(--threat);background:var(--threat-tint);border-color:color-mix(in srgb,var(--threat) 35%,var(--line))}
  .st.running{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
  .st.skipped{color:var(--ink-faint)}
  .when{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);margin-left:auto}
  .conns{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .conn{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line-soft);border-radius:8px;padding:5px 9px;background:var(--card-2);color:var(--ink-soft)}
  .conn b{color:var(--ink)}
  .conn .er{color:var(--threat)}
  .conn .ok{color:var(--win)}
  .err{font-family:var(--mono);font-size:12px;color:var(--threat);background:var(--threat-tint);border-radius:8px;padding:8px 10px;margin-top:10px;white-space:pre-wrap;overflow-x:auto}
  .empty{text-align:center;color:var(--ink-faint);padding:50px 0}
  :focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:5px}
</style>
</head>
<body>
<div class="top">
  <div class="in">
    <a class="logo" href="./index.html"><span class="beacon" aria-hidden="true"></span><b>MAJÁK</b></a>
    <nav class="nav">
      <a href="./index.html">Hub</a>
      <a href="./report.html">Report</a>
      <a href="./import.html">Import</a>
      <a href="./zoznam.html">Zoznam</a>
      <a href="./osoby.html">Osoby</a>
      <a href="./otazky.html">Otázky</a>
      <a href="./behy.html" class="active" aria-current="page">Behy</a>
    </nav>
  </div>
</div>
<div class="wrap">
  <header class="hd">
    <div class="eyebrow">Behy · kontrola plánovaných behov</div>
    <h1>Čo zbehlo a čo nie</h1>
    <p class="lead">História nočných (04:00) a večerných (18:00) behov — pri každom vidíš stav a
      koľko každý konektor <b>stiahol</b> / <b>spracoval</b> / <b>chýb</b>.</p>
  </header>
  <div class="refresh">
    <button class="b" id="reload">↻ Obnoviť</button>
    <span class="count" id="count"></span>
  </div>
  <div id="list"></div>
</div>

<script>
(function(){
  "use strict";
  var DEF="https://majak-api.onrender.com/api";
  function base(){return (localStorage.getItem("majak.apiBase")||DEF).replace(/\/$/,"");}
  function token(){return localStorage.getItem("majak.token")||"";}
  var $=function(s){return document.querySelector(s)};
  var esc=function(s){return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
  function fmt(ts){ if(!ts) return "—"; try{var d=new Date(ts);return d.toLocaleString("sk-SK",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}catch(e){return ts;} }

  function connChips(stats){
    var conns=(stats&&stats.connectors)||{};
    return Object.keys(conns).map(function(name){
      var c=conns[name]||{};
      var body;
      if(c.error!==undefined) body='<span class="er">chyba</span>';
      else if(c.skipped!==undefined) body='preskočené';
      else body='stiahnuté <b>'+(c.fetched||0)+'</b> · spracované <b>'+(c.ingested||0)+'</b>'+
                (c.errors?' · <span class="er">chýb '+c.errors+'</span>':' · <span class="ok">ok</span>');
      return '<span class="conn">'+esc(name)+': '+body+'</span>';
    }).join("");
  }

  function runCard(r){
    var d=document.createElement("div");
    d.className="run "+(r.status||"");
    var conns=connChips(r.stats);
    var extra="";
    if(r.stats&&r.stats.carried_items!==undefined)
      extra='<span class="conn">prenesené <b>'+r.stats.carried_items+'</b> · kalendár <b>'+(r.stats.calendar_sources||0)+'</b></span>';
    d.innerHTML=
      '<div class="rh"><span class="job">'+esc(r.job)+'</span>'+
      '<span class="st '+(r.status||"")+'">'+esc(r.status)+'</span>'+
      (r.on_day?'<span class="count">'+esc(r.on_day)+'</span>':'')+
      '<span class="when">'+fmt(r.started_at)+(r.finished_at?' → '+fmt(r.finished_at):'')+'</span></div>'+
      ((conns||extra)?'<div class="conns">'+conns+extra+'</div>':'')+
      (r.error?'<div class="err">'+esc(r.error)+'</div>':'');
    return d;
  }

  async function load(){
    var list=$("#list"), cnt=$("#count");
    cnt.textContent="načítavam…";
    try{
      var r=await fetch(base()+"/runs?limit=50",{headers:{Authorization:"Bearer "+token()}});
      if(!r.ok) throw new Error("HTTP "+r.status);
      var rows=await r.json();
      cnt.textContent=rows.length+" behov";
      list.innerHTML="";
      if(!rows.length){ list.innerHTML='<div class="empty">Zatiaľ žiadne behy. Po prvom 04:00/18:00 (alebo manuálnom spustení) sa tu objavia.</div>'; return; }
      rows.forEach(function(row){ list.appendChild(runCard(row)); });
    }catch(e){
      cnt.textContent=""; list.innerHTML='<div class="empty">Nepodarilo sa načítať behy: '+esc(e.message)+'</div>';
    }
  }
  $("#reload").onclick=load;
  if(token()) load();
})();
</script>
</body>
</html>
