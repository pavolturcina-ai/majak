<!DOCTYPE html>
<!--
  MAJÁK — reference thin-client (Phase 1).

  This is a minimal reference that demonstrates wiring the existing interactive
  report to the API via api.js. In production, keep the CEO's existing single-
  file report and only (1) include api.js, (2) replace the embedded SEED/SOURCES
  constants with MajakAPI.currentDay() / MajakAPI.sources(), and (3) route the
  done/edit/delete/reorder/list-tag handlers to the MajakAPI mutation methods.
  Light theme, as required.
-->
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MAJÁK</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --ink: #1c2230;
        --muted: #6b7280;
        --line: #e5e7eb;
        --hi: #dc2626;
        --mid: #d97706;
        --win: #16a34a;
        --dec: #2563eb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.5 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      header {
        padding: 18px 22px;
        background: var(--card);
        border-bottom: 1px solid var(--line);
      }
      h1 { margin: 0; font-size: 18px; }
      .pulse { color: var(--muted); margin-top: 4px; }
      main { max-width: 860px; margin: 0 auto; padding: 22px; }
      .section { margin-bottom: 26px; }
      .section h2 {
        font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
        color: var(--muted); margin: 0 0 10px;
      }
      .item {
        background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--line);
        border-radius: 8px; padding: 12px 14px; margin-bottom: 8px;
      }
      .item.rail-hi { border-left-color: var(--hi); }
      .item.rail-mid { border-left-color: var(--mid); }
      .item.rail-win { border-left-color: var(--win); }
      .item.rail-dec { border-left-color: var(--dec); }
      .item .title { font-weight: 600; }
      .item .desc { color: var(--muted); font-size: 14px; margin-top: 2px; }
      .item .row { display: flex; gap: 8px; margin-top: 8px; }
      button {
        font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink);
        border-radius: 6px; padding: 4px 10px; cursor: pointer;
      }
      button:hover { background: #f0f2f5; }
      .empty { color: var(--muted); }
      .banner { background: #fef3c7; color: #92400e; padding: 8px 22px; font-size: 14px; }
    </style>
  </head>
  <body>
    <header>
      <h1>MAJÁK</h1>
      <div class="pulse" id="pulse">Načítavam…</div>
    </header>
    <div class="banner" id="banner" style="display: none"></div>
    <main id="app"></main>

    <script src="api.js"></script>
    <script>
      const SECTION_LABELS = {
        top: "Priority",
        decision: "Rozhodnutia",
        good: "Dobré správy",
        threat: "Hrozby",
        deleg: "Delegovať",
        quick: "Rýchle výhry",
        radar: "Radar",
      };

      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }

      function renderItem(it) {
        const card = el("div", "item rail-" + (it.rail || "signal"));
        card.appendChild(el("div", "title", it.title));
        if (it.description) card.appendChild(el("div", "desc", it.description));
        const row = el("div", "row");
        const done = el("button", null, "Hotovo");
        done.onclick = async () => {
          try { await MajakAPI.markDone(it.id); load(); }
          catch (_) { flash("Offline — zmena zaradená do fronty."); }
        };
        const del = el("button", null, "Zmazať");
        del.onclick = async () => {
          const reason = prompt("Dôvod zmazania:");
          if (!reason) return;
          try { await MajakAPI.remove(it.id, reason); load(); }
          catch (_) { flash("Offline — zmena zaradená do fronty."); }
        };
        row.appendChild(done);
        row.appendChild(del);
        card.appendChild(row);
        return card;
      }

      function flash(msg) {
        const b = document.getElementById("banner");
        b.textContent = msg;
        b.style.display = "block";
        setTimeout(() => (b.style.display = "none"), 3000);
      }

      async function load() {
        const app = document.getElementById("app");
        app.innerHTML = "";
        let day;
        try {
          day = await MajakAPI.currentDay();
        } catch (err) {
          document.getElementById("pulse").textContent = "Nepodarilo sa načítať deň.";
          return;
        }
        document.getElementById("pulse").textContent = day.pulse || "";
        for (const key of Object.keys(SECTION_LABELS)) {
          const items = (day.sections && day.sections[key]) || [];
          if (!items.length) continue;
          const sec = el("div", "section");
          sec.appendChild(el("h2", null, SECTION_LABELS[key]));
          items.forEach((it) => sec.appendChild(renderItem(it)));
          app.appendChild(sec);
        }
        if (!app.children.length) app.appendChild(el("div", "empty", "Žiadne položky."));
      }

      // For local dev without Supabase Auth, use the dev token (see .env CRON_SECRET).
      if (!localStorage.getItem("majak.token")) MajakAPI.setToken("dev-cron-secret");
      load();
    </script>
  </body>
</html>
