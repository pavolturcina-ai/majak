<style>

  :root[data-theme="dark"]{

 "url": "https://gospaceworkspacegroup.slack.com/archives/D0A1XK475JM/p1783680901386049"}], "day": "10.7."}, {"t": "EC Call for Evidence (Horizon Europe) — deadline 14.7.", "d": "Roman dodal draft; dotiahnuť a podať do utorka. Padá hneď po víkende.", "rail": "signal", "own": ["Pavol"], "carry": "z 9.7.", "chips": [["hot", "deadline utorok"], ["owner", "Pavol → Andrej/Zuzana"]], "ctx": [{"q": "Prenesené z 9.7.: Roman poslal draft k EC Call for Evidence (Horizon Europe). Deadline 14.7., cez víkend.", "who": "—", "src": "Prenos + Gmail (9.7.)", "loc": "", "url": null}], "day": "10.7."}, {"t": "Potvrdiť Antonovi service agreement (KPI)", "d": "Anton prečítal Annex, pripravený podpísať v utorok — 3 veci doladiť, pridal ťa na potvrdenie.", "rail": "signal", "own": ["Pavol", "Anton"], "chips": [["owner", "Pavol"], ["when", "pred utorkom"], ["src", "Gmail"]], "ctx": [{"q": "Prečítal som všetko a v utorok som pripravený podpísať. Len 3 veci by som ešte rád doladil. Pavol, pridávam ťa, aby si potvrdil.", "who": "Anton Antonenko", "src": "Gmail · vlákno", "loc": "", "url": "https://mail.google.com/mail/u/0/#inbox/19f4cc41cd6c29d5"}], "day": "10.7."}, {"t": "Go/no-go na UVO tender + spustiť prípravu", "d": "Ondrej: zhoda 80–90 %, chcú kamery na 50 tokov, HW ~250 tis. €. Uzávierka 11.8. 13:00.", "rail": "signal", "own": ["Pavol", "Ondrej"], "chips": [["owner", "Pavol + Ondrej"], ["when", "uzávierka 11.8."], ["src", "Slack · UVO"]], "ctx": [{"q": "Máme tam zhodu na 80–90 % — niečo bude treba dotiahnuť, chcú kamery na 50 tokov. Naše náklady na HW odhadujem na 250 tis. €.", "who": "Ondrej Závodský", "src": "Slack · DM", "loc": "", "url": "https://gospaceworkspacegroup.slack.com/archives/D02STDT7QP4/p1783682272327089"}, {"q": "Poďme to vyhrať. Uzávierka 11.08.2026, 13:00.", "who": "Pavol", "src": "Slack · UVO tender", "loc": "", "url": "https://www.uvo.gov.sk/vyhladavanie/vyhladavanie-dokumentov/detail/3590589?cHash=ec03651395c23b51578a270a609d5a30"}], "day": "10.7."}, {"t": "Potvrd   function load(){try{var s=JSON.parse(localStorage.getItem(STORE_KEY));return (s&&s.sections)?s:SEED;}catch(e){return SEED;}}
  function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state));}
  var state = load();
  var KINDS=[["all","Všetko"],["uloha","Úlohy"],["napad","Nápady"],["poznamka","Poznámky"]];
  var STATUS=[["all","Všetko"],["open","Otvorené"],["done","Hotové"]];
  var kind="all", status="all", owner="all";
  var $=function(s){return document.querySelector(s)};
  var esc=function(s){return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};

  function flat(){
    var out=[];
    state.sections.forEach(function(sec,si){
      (sec.items||[]).forEach(function(it,ii){ out.push({it:it,sec:sec,si:si,ii:ii}); });
    });
    return out;
  }
  function owners(){
    var set={};
    flat().forEach(function(e){ (e.it.own||[]).forEach(function(o){ String(o).split(/[\/,]/).forEach(function(x){x=x.trim();if(x)set[x]=1;}); }); });
    return Object.keys(set).sort();
  }
  function kcount(k){ return flat().filter(function(e){return k==="all"?true:e.it.list===k;}).length; }

  function matches(e){
    if(kind!=="all" && e.it.list!==kind) return false;
    if(status==="open" && e.it.done) return false;
    if(status==="done" && !e.it.done) return false;
    if(owner!=="all" && !((e.it.own||[]).join("/").indexOf(owner)>=0)) return false;
    return true;
  }

  function setList(si,ii,k){
    var it=state.sections[si].items[ii];
    if(it.list===k) delete it.list; else it.list=k;
    save(); render();
  }

  function render(){
    // filter chips
    $("#kinds").innerHTML=KINDS.map(function(k){
      var n=kcount(k[0]);
      return '<button class="chip '+(kind===k[0]?"on":"")+'" data-k="'+k[0]+'">'+k[1]+
        (k[0]!=="all"?' <span class="n">'+n+'</span>':'')+'</button>';
    }).join("");
    $("#stats").innerHTML=STATUS.map(function(s){
      return '<button class="chip '+(status===s[0]?"on":"")+'" data-s="'+s[0]+'">'+s[1]+'</button>';
    }).join("");
    $("#kinds").querySelectorAll(".chip").forEach(function(b){b.onclick=function(){kind=b.dataset.k;render();};});
    $("#stats").querySelectorAll(".chip").forEach(function(b){b.onclick=function(){status=b.dataset.s;render();};});

    var os=$("#owner");
    if(os.dataset.built!=="1"){
      os.innerHTML='<option value="all">Všetci</option>'+owners().map(function(o){return '<option>'+esc(o)+'</option>';}).join("");
      os.dataset.built="1"; os.onchange=function(){owner=os.value;render();};
    }

    var rows=flat().filter(matches);
    $("#count").textContent=rows.length+" položiek"+(kind!=="all"||status!=="all"||owner!=="all"?" (filtrované)":" · celý archív");
    if(!rows.length){ $("#list").innerHTML='<div class="empty">Nič nezodpovedá filtru. Polož­ky sa označujú tlačidlami Úloha / Nápad / Poznámka nižšie alebo v reporte.</div>'; return; }

    $("#list").innerHTML=rows.map(function(e){
      var it=e.it, rail="r-"+(it.rail||"signal");
      var day=it.day||"";
      var sec=(e.sec.title||"").split("—")[0].trim();
      var own=(it.own||[]).join(", ");
      var doneBadge=it.done?'<span class="badge done">Hotové</span>':'<span class="badge open">Otvorené</span>';
      var lks=[["uloha","Úloha"],["napad","Nápad"],["poznamka","Poznámka"]].map(function(k){
        return '<button class="lk '+(it.list===k[0]?"on":"")+'" data-si="'+e.si+'" data-ii="'+e.ii+'" data-k="'+k[0]+'">'+k[1]+'</button>';
      }).join("");
      return '<div class="row '+rail+(it.done?" done":"")+'">'+
        '<div class="rtop"><div class="rt">'+esc(it.t)+'</div>'+doneBadge+'</div>'+
        (it.d?'<div class="rmeta" style="color:var(--ink-soft)">'+esc(it.d)+'</div>':'')+
        '<div class="rmeta"><span class="day">'+esc(day)+'</span><span>'+esc(sec)+'</span>'+(own?'<span>'+esc(own)+'</span>':'')+'</div>'+
        '<div class="tag"><span class="tl">uložiť do zoznamu</span>'+lks+'</div>'+
      '</div>';
    }).join("");
    $("#list").querySelectorAll(".lk").forEach(function(b){
      b.onclick=function(){ setList(+b.dataset.si,+b.dataset.ii,b.dataset.k); };
    });
  }
  render();
})();
</script>
</body>
</html>
